name: IRCTC PNR Waiting List 24/7 Monitor

on:
  schedule:
    # Runs every 5 hours (at minute 0 past every 5th hour)
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions anytime

permissions:
  contents: read
  actions: write

concurrency:
  group: pnr-monitor
  cancel-in-progress: false

jobs:
  check-pnr:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run verification test suite
        run: |
          python -m pytest -v

      - name: Restore private state cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/status_state.json
          key: pnr-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            pnr-state-${{ runner.os }}-

      - name: Execute PNR Status Check
        env:
          PNR_NUMBER: ${{ secrets.PNR_NUMBER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          RAPIDAPI_HOST: ${{ secrets.RAPIDAPI_HOST }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py --state-file "$RUNNER_TEMP/status_state.json"
