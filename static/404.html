<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | IRCTC RailPulse</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #24211E;
      background-image: radial-gradient(ellipse 700px 400px at 50% 20%, rgba(217, 166, 91, 0.06) 0%, transparent 80%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #F4EBDD;
    }
    .card {
      background: #302B26;
      border: 1px solid #494037;
      border-radius: 14px;
      padding: 40px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .code {
      font-size: 72px;
      font-weight: 900;
      color: #D9A65B;
      line-height: 1;
      margin: 0 0 12px 0;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 10px 0;
      font-weight: 800;
      color: #F4EBDD;
    }
    p {
      color: #B9ADA0;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #D9A65B;
      color: #1E1B18;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 6px;
      box-shadow: 0 4px 14px rgba(217, 166, 91, 0.25);
      transition: all 0.2s;
    }
    .btn:hover {
      background: #E5B66F;
      box-shadow: 0 6px 18px rgba(217, 166, 91, 0.4);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Requested Track Not Found</h1>
    <p>The IRCTC page or ticket tracking slug you are looking for has departed or does not exist.</p>
    <a href="/" class="btn">Return to Train Search</a>
  </div>
</body>
</html>
