<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found | IRCTC RailPulse</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #eef2fb 0%, #f5f0ea 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #0f172a;
    }
    .card {
      background: #ffffff;
      border: 1px solid #dde3ee;
      border-radius: 20px;
      padding: 40px;
      max-width: 520px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .code {
      font-size: 72px;
      font-weight: 900;
      color: #0b57d0;
      line-height: 1;
      margin: 0 0 12px 0;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 10px 0;
      font-weight: 800;
      color: #0f172a;
    }
    p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .btn {
      display: inline-block;
      background: #0b57d0;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(11, 87, 208, 0.3);
      transition: all 0.2s;
    }
    .btn:hover {
      background: #0945a8;
      box-shadow: 0 6px 18px rgba(11, 87, 208, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Requested Track Not Found</h1>
    <p>The IRCTC page or ticket tracking slug you are looking for has departed or does not exist.</p>
    <a href="/" class="btn">Return to Train Search</a>
  </div>
</body>
</html>
